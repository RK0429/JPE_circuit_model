[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "jpe-circuit-model"
version = "0.1.0"
description = ""
authors = ["Ryota Kobayashi <s.woods.m.29@gmail.com>"]
packages = [
    { include = "python_integration" },
    { include = "post_processing" },
    { include = "fitting" },
]

[tool.poetry.dependencies]
python = "^3.11"
lmfit = "^1.3.3"
matplotlib = "^3.10.1"
numpy = "^2.2.5"
pandas = "^2.2.3"
pandas-stubs = "^2.2.3.250308"
polars = "^1.29.0"
plotly = "^6.0.1"
kupicelib = "^1.0.1"
kuPyLTSpice = "^1.0.0"
cespy = "^0.1.0"
docformatter = "^1.7.7"
pylint = "^3.3.7"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.3.2"
black = "^23.1.0"
flake8 = "^7.1.0"
mypy = "^1.5.1"
pytest = "^8.4.1"
pyright = "^1.1.401"

[project]
name = "jpe-circuit-model"
version = "0.1.0"
description = "JPE circuit modeling utilities"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ryota Kobayashi", email = "s.woods.m.29@gmail.com" },
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "lmfit>=1.3.3,<2.0.0",
    "matplotlib>=3.10.1,<4.0.0",
    "numpy>=2.2.5,<3.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pandas-stubs>=2.2.3.250308,<3.0.0",
    "polars>=1.29.0,<2.0.0",
    "plotly>=6.0.1,<7.0.0",
    "kupicelib>=1.0.1,<2.0.0",
    "kuPyLTSpice>=1.0.0,<2.0.0",
    "cespy>=0.1.0,<1.0.0",
    "docformatter>=1.7.7,<2.0.0",
    "pylint>=3.3.7,<4.0.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2,<3.0.0",
    "black>=23.1.0,<24.0.0",
    "flake8>=7.1.0,<8.0.0",
    "mypy>=1.5.1,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pyright>=1.1.401,<2.0.0",
]
